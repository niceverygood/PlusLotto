name: Admin validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build/test fixtures are local; no production credentials or customer dumps are needed.
      VITE_DATA_SOURCE: mock
      VITE_BRAND: pluslotto
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Check legacy import and preflight safety with synthetic fixtures
        run: |
          bash -n scripts/preflight-legacy-load.sh
          python3 scripts/test_load_legacy_site.py
          python3 scripts/test_preflight_legacy_load.py
          python3 scripts/test_815_collision_review.py
          python3 scripts/test_815_collision_history.py
          python3 scripts/test_legacy_history_payload.py

      - name: Run TypeScript regressions
        run: node --import tsx --test scripts/tests/*.test.ts

      - name: Install in-memory PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/pluslotto-site-scope-pgtest" --no-package-lock --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8

      - name: Run database scope regressions in memory
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pluslotto-site-scope-pgtest/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test --test-concurrency=1 scripts/tests/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Verify manual issuance transactions on isolated PostgreSQL
        run: |
          docker pull postgres:17-alpine
          mkdir -p "$RUNNER_TEMP/manual-reco-evidence"
          python3 scripts/tests/test_manual_additional_postgres.py --report "$RUNNER_TEMP/manual-reco-evidence/claim.json"
          python3 scripts/tests/test_manual_reco_consumers_postgres.py --report "$RUNNER_TEMP/manual-reco-evidence/consumers.json" --keep-container
          TEST_DB=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/manual-reco-evidence/consumers.json"))["synthetic_container"])')
          trap 'docker rm -f "$TEST_DB"' EXIT
          docker run --rm --network "container:$TEST_DB" -e PG_META_GENERATE_TYPES=typescript -e PG_META_GENERATE_TYPES_INCLUDED_SCHEMAS=public -e PG_META_DB_HOST=127.0.0.1 public.ecr.aws/supabase/postgres-meta:v0.99.0 > "$RUNNER_TEMP/manual-reco-evidence/generated-full.ts"

      - name: Preserve synthetic transaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-reco-synthetic-evidence
          path: ${{ runner.temp }}/manual-reco-evidence
          retention-days: 7

      - name: Build
        run: npm run build
